<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Goals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div><h1>Savings Goals</h1><p>Create goals and track contributions.</p></div><a href="http://localhost:8080">Back to home</a></header>
  <main>
    <p id="status" class="notice">Checking backend...</p>

    <section>
      <h2 id="goal-form-title">Add a savings goal</h2>
      <form id="goal-form">
        <label>Goal name<input id="goal-name" type="text" maxlength="100" required></label>
        <label>Target amount ($)<input id="goal-target" type="number" min="0.01" step="0.01" required></label>
        <label>Target date<input id="goal-date" type="text" placeholder="DD-MM-YYYY" pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}" required></label>
        <div class="actions"><button type="submit" id="goal-save">Add goal</button><button type="button" id="goal-cancel" class="secondary hidden">Cancel</button></div>
      </form>
    </section>

    <section>
      <div class="heading"><h2>Your goals</h2><button id="refresh" class="secondary">Refresh</button></div>
      <p id="goals-message">Loading...</p>
      <div class="table-wrap"><table id="goals-table" class="hidden"><thead><tr><th>Goal</th><th>Saved</th><th>Target</th><th>Progress</th><th>Date</th><th>Actions</th></tr></thead><tbody id="goals-body"></tbody></table></div>
    </section>

    <section id="detail" class="hidden">
      <div class="heading"><div><h2 id="detail-name"></h2><p id="detail-summary"></p></div><button id="detail-close" class="secondary">Close</button></div>
      <h3 id="contribution-form-title">Add a contribution</h3>
      <form id="contribution-form">
        <label>Amount ($)<input id="contribution-amount" type="number" min="0.01" step="0.01" required></label>
        <label>Date<input id="contribution-date" type="text" placeholder="DD-MM-YYYY" pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}" required></label>
        <div class="actions"><button type="submit" id="contribution-save">Add contribution</button><button type="button" id="contribution-cancel" class="secondary hidden">Cancel</button></div>
      </form>
      <div class="table-wrap"><table><thead><tr><th>Amount</th><th>Date</th><th>Actions</th></tr></thead><tbody id="contributions-body"></tbody></table></div>
      <div class="ai"><h3>AI savings advice</h3><label>Optional question<textarea id="ai-question" rows="3" placeholder="How much should I save each week?"></textarea></label><button id="ai-button">Generate advice</button><p id="ai-result" class="result hidden"></p></div>
    </section>
    <p id="message" class="notice hidden"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
