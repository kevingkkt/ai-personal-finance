services:

  front-page:
    build:
      context: ./front-page
    container_name: finance-front-page
    ports:
      - "8080:80"

  kevin-database:
    build:
      context: ./kevin/database
    container_name: kevin-database
    ports:
      - "5002:5002"
    volumes:
      - ./kevin/database/transactions.db:/app/transactions.db

  budget-manager-database:
    build:
      context: ./budget-manager/database
    container_name: budget-manager-database
    ports:
      - "5003:5003"
    volumes:
      - ./budget-manager/database/budget.db:/app/budget.db

  ollama:
    image: ollama/ollama:latest
    container_name: finance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  kevin-backend:
    build:
      context: ./kevin/backend
    container_name: kevin-backend
    ports:
      - "5001:5001"
    environment:
      - DATABASE_API_URL=http://kevin-database:5002
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on:
      - kevin-database
      - ollama

  budget-manager-backend:
    build:
      context: ./budget-manager/backend
    container_name: budget-manager-backend
    ports:
      - "5004:5004"
    environment:
      - DATABASE_API_URL=http://budget-manager-database:5003
    depends_on:
      - budget-manager-database

  kevin-frontend:
    build:
      context: ./kevin/frontend
    container_name: kevin-frontend
    ports:
      - "8081:80"
    depends_on:
      - kevin-backend

  budget-manager-frontend:
    build:
      context: ./budget-manager/frontend
    container_name: budget-manager-frontend
    ports:
      - "8082:80"
    depends_on:
      - budget-manager-backend  

volumes:
  ollama-data: