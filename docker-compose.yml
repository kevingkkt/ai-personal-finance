services:

  front-page:
    build:
      context: ./front-page
    container_name: finance-front-page
    ports:
      - "3000:80"

  # Kevin - Income & Expense Tracker

  kevin-database:
    build:
      context: ./kevin/database
    container_name: kevin-database
    ports:
      - "6001:5002"
    volumes:
      - ./kevin/database/transactions.db:/app/transactions.db

  ollama:
    image: ollama/ollama:latest
    container_name: finance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  kevin-backend:
    build:
      context: ./kevin/backend
    container_name: kevin-backend
    ports:
      - "5001:5001"
    environment:
      - DATABASE_API_URL=http://kevin-database:5002
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on:
      - kevin-database
      - ollama

  kevin-frontend:
    build:
      context: ./kevin/frontend
    container_name: kevin-frontend
    ports:
      - "3001:80"
    depends_on:
      - kevin-backend

  # Luke - Bills & Payments

  bills-database:
    build:
      context: ./Luke/database
    container_name: bills-database
    ports:
      - "6004:5002"

  bills-backend:
    build:
      context: ./Luke/backend
    container_name: bills-backend
    ports:
      - "5004:5001"
    environment:
      - DATABASE_API_URL=http://bills-database:5002
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    depends_on:
      - bills-database

  bills-frontend:
    build:
      context: ./Luke/frontend
    container_name: bills-frontend
    ports:
      - "3004:80"
    depends_on:
      - bills-backend

volumes:
  ollama-data: