services:

  front-page:
    build:
      context: ./front-page
    container_name: finance-front-page
    ports:
      - "8080:80"

  budget-manager-database:
    build:
      context: ./budget-manager/database
    container_name: budget-manager-database
    ports:
      - "5007:5007"
    volumes:
      - ./budget-manager/database/budgets.db:/app/budgets.db
    

  ollama:
    image: ollama/ollama:latest
    container_name: finance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
  
  budget-manager-backend:
    build:
      context: ./budget-manager/backend
    container_name: budget-manager-backend
    ports:
      - "5008:5008"
    environment:
      - DATABASE_API_URL=http://budget-manager-database:5007
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on:
      - budget-manager-database
      - ollama

  budget-manager-frontend:
    build:
      context: ./budget-manager/frontend
    container_name: budget-manager-frontend
    ports:
      - "8082:80"
    depends_on:
      - budget-manager-backend

volumes:
  ollama-data: