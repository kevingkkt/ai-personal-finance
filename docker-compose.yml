services:

  front-page:
    build:
      context: ./front-page
    container_name: finance-front-page
    ports:
      - "8080:80"



  # Grace - Savings goal

  grace-database:
    build:
      context: ./grace/database
    container_name: grace-database
    ports:
      - "6003:6003"
    environment:
      DB_PATH: /app/data/savings_goals.db
    volumes:
      - grace-savings-data:/app/data
    restart: unless-stopped

  grace-backend:
    build:
      context: ./grace/backend
    container_name: grace-backend
    ports:
      - "5003:5003"
    environment:
      DATABASE_API_URL: http://grace-database:6003
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      AI_ADVICE_MODEL: deepseek-r1:1.5b
      AGENTIC_MODEL: qwen2.5:1.5b
    depends_on:
      - grace-database
    restart: unless-stopped

  grace-frontend:
    build:
      context: ./grace/frontend
    container_name: grace-frontend
    ports:
      - "3003:80"
    depends_on:
      - grace-backend
    restart: unless-stopped

  

  # Kevin - Income & Expense Tracker

  kevin-database:
    build:
      context: ./kevin/database
    container_name: kevin-database
    ports:
      - "6001:5002"
    volumes:
      - ./kevin/database/transactions.db:/app/transactions.db

  kevin-backend:
    build:
      context: ./kevin/backend
    container_name: kevin-backend
    ports:
      - "5001:5001"
    environment:
      - DATABASE_API_URL=http://kevin-database:5002
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - MCP_URL=http://host.docker.internal:7001/mcp
      - RAG_URL=http://host.docker.internal:7002/rag
    depends_on:
      - kevin-database
     

  kevin-frontend:
    build:
      context: ./kevin/frontend
    container_name: kevin-frontend
    ports:
      - "3001:80"
    depends_on:
      - kevin-backend

  # Luke - Bills & Payments

  
  bills-database:
    build:
      context: ./Luke/database
    container_name: bills-database
    ports:
      - "6004:5002"

  bills-backend:
    build:
      context: ./Luke/backend
    container_name: bills-backend
    ports:
      - "5004:5001"
    environment:
      - DATABASE_API_URL=http://bills-database:5002
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    depends_on:
      - bills-database

  bills-frontend:
    build:
      context: ./Luke/frontend
    container_name: bills-frontend
    ports:
      - "3004:80"
    depends_on:
      - bills-backend

  budget-manager-frontend:
    build:
      context: ./budget-manager/frontend
    container_name: budget-manager-frontend
    ports:
      - "3002:80"
    depends_on:
      - budget-manager-backend
    
  # Lex - Budget Manager
  
  budget-manager-backend:
    build:
      context: ./budget-manager/backend
    container_name: budget-manager-backend
    ports:
      - "5002:5002"
    environment:
      - DATABASE_API_URL=http://budget-manager-database:6002
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    depends_on:
      - budget-manager-database


  budget-manager-database:
    build:
      context: ./budget-manager/database
    container_name: budget-manager-database
    ports:
      - "6002:6002"
    volumes:
      - ./budget-manager/database/budgets.db:/app/budgets.db

volumes:
  grace-savings-data:
