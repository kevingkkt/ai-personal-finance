<body>
    <div class="Main">

                </thead>
                <tbody id="billRows">

                    <!-- Bill rows will be added somehow Ill come back -->
                </tbody>
            </table>
            <!-- I want a tick box to sort by paid or unpaid-->

        </div>

        <div class="AI">
            <!--    I want a text box to use to enter stuff and then space for ai to respond then a button-->

                <h2>AI Assistant</h2>
                <!-- dont need i changed my mind<input type="text" id="context-question" name="question" placeholder="Ask AI for more specific advice."> -->

            <!--Changed mind we only doing the get total unpaid as its enough and I dont care enough to do better-->

            <h2>RAG Mode</h2>

            <input type="text" id="ragQuestion" name="question" placeholder="Ask RAG for more specific advice.">

<script >
    //Table scripts
    //calling backend 
    async function fetchBills() {
        const billRows = document.getElementById('billRows');

        billRows.innerHTML = `<tr><td colspan="5">Waiting for bills...</td></tr>`;
        try 
        {
            const response = await fetch("http://127.0.0.1:5004/bills");
            if (!response.ok) 
            {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
        
            
            const bills = await response.json();

            billRows.innerHTML = "";

            bills.forEach(bill => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${bill.bill_id}</td>
                    <td>${bill.payment_status == 1 ? "Paid" : "Pending"}</td>
                    <td>${bill.due_date}</td>
                    <td>${bill.amount}</td>
                    <td>${bill.description}</td>
                `;
                billRows.appendChild(row);
            });
        }
        catch (error) {
            console.error('Error fetching bills:', error);
            billRows.innerHTML = `<tr><td colspan="5">Error fetching bills. Please try again later.</td></tr>`;
        }
    }
    fetchBills();
    //ai scripts\
    
    const submit = document.getElementById('askAIAdviceForm').querySelector('button');
    submit.addEventListener('click', async (event) => {
        console.log("ai script loaded");
        event.preventDefault();
        const userinput = document.getElementById('aiQuestion').value;
        const AIresponse = document.getElementById('aiResponse');
        AIresponse.innerHTML = "Ai Has not responded yet";
        try {
            console.log("fetching AI insights with user input:", userinput);
            const response = await fetch("http://127.0.0.1:5004/ai-insights", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ input: userinput })
            });


            const output = await response.json();
            AIresponse.innerHTML = "";
            AIresponse.textContent = output.insight;
            console.log("AI insight received:", output.insight);
            console.log("made to the end of the try block for ai script");
        } catch (error) {
            console.error('Error fetching AI insights:', error);
            AIresponse.innerHTML = "Error fetching AI insights. Please try again later.";
        }
    });


    //MCP area
    const mcpOnOff = document.getElementById("mcpOnOff");
    const totalUnpaidButton = document.getElementById("totalUnpaidButton");
    const mcpOutput = document.getElementById("mcpOutput");

    //we want default set up 
    //same as lab
    function isMcpEnabled() {
        return mcpOnOff.checked;
    }
    function renderMcpState() {

        if (isMcpEnabled()) {
            //we also want to change this to be 
            totalUnpaidButton.disabled = false;
            mcpOutput.textContent ="MCP is ON Feel free to use as you please";
        } else {
            //adding button toggle
            totalUnpaidButton.disabled =true;
            mcpOutput.textContent = "MCP is OFF";

            //tell them to turn it off
        
        }

    }



// When checkbox is changed
mcpOnOff.addEventListener("change", () => {

    renderMcpState();

    if (!isMcpEnabled()) {
         //tell them to turn it off
        mcpOutput.textContent ="MCP is OFF. Enable MCP to use the tool.";
    }
    else
    {
         mcpOutput.textContent ="MCP is ON Feel free to use as you please";
    }

});
//default setting these upp than event listener deals with it

    renderMcpState();

    if (!isMcpEnabled()) {

         mcpOutput.textContent ="MCP is OFF. Enable MCP to use the tool.";

    }

//Now the set up for on button click we run the main function
// Get total unpaid
totalUnpaidButton.addEventListener("click", async () => {
//To make the user have instant feedback
    mcpOutput.textContent ="trying to get total unpaid bills please wait.";

    try {

        const response = await fetch("http://127.0.0.1:5004/mcp/total-unpaid");
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error);
        }

        mcpOutput.textContent ="Total unpaid: $" + result.result.total_unpaid;

    } catch (error) {

        console.error("MCP error:", error);

        mcpOutput.textContent ="Error getting total unpaid. Error was:"+ error;

    }

});

/////////////////////////////////////////////////
//////////RAG AREA////////////////////////
///////////////////////////////////////////
const ragOutput = document.getElementById("ragOutput");
const ragOnOff = document.getElementById("ragOnOff");
const ragQuestion = document.getElementById("ragQuestion");
const ragButton = document.getElementById("ragButton");

function isRagEnabled() {
    return ragOnOff.checked;
}

//same as mcp
function renderRagState() {
    if (isRagEnabled()) {
        ragButton.disabled = false;
        ragOutput.textContent = "RAG is ON.ask your question when ready";
    } else {
        ragButton.disabled = true;
        ragOutput.textContent = "RAG is OFF. click on the check to enable rag";
    }
}

//event
ragOnOff.addEventListener("change", () => {
    renderRagState();
});

//the actual rag part
// Ask RAG
ragButton.addEventListener(
    "click",
    async function () {

        const question =
            ragQuestion.value.trim();

        if (!question) {

            ragOutput.textContent =
                "Sorry You didn't enter anything as a question. please add something to the text box above";

            return;
        }

        ragOutput.textContent =
            "Calling RAG please wait";

        try {

            const response =
                await fetch(
                    "http://127.0.0.1:5004/rag-query",{
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            query: question
                        })
                    }
                );

            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "RAG request failed"
                );
            }

//do same as kevin
            if (data.grounded === false) {

                ragOutput.textContent =
                    `${data.answer}\n` +
                    `Confidence: ${data.confidence}`;

                return;
            }


            const sources =
                data.sources.join(", ");


            ragOutput.textContent =
                `Answer: ${data.answer}\n\n` +
                `Source: ${sources}\n` +
                `Confidence: ${data.confidence}`;
        } catch (error) {
            console.error(error);
            ragOutput.textContent =
                "Failed to connect to Rag.";
        }
    }
);
//run this so it checks on open
renderRagState();




</script>
</body>
