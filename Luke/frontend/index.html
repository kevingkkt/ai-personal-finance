    <div class="AI">
        <!--    I want a text box to use to enter stuff and then space for ai to respond then a button-->

            <label for="context-question">Question</label>
            <input type="text" id="context-question" name="question" placeholder="Ask AI for more specific advice.">
            <textarea id="aiQuestion" name="question" rows="4"></textarea>
            <button type="submit">Ask </button>
        </form>
    </div>
