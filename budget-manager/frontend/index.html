<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget Manager</title>

    <link rel="stylesheet" href="style.css">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body>

    <div class="container">

        <h1>Budget Manager</h1>

        <form id="budgetForm">

            <label for="name">Budget Name</label>
            <input
                type="text"
                id="name"
                placeholder="e.g. Groceries, Entertainment"
                required
            >

            <label for="amount">Amount</label>
            <input
                type="number"
                id="amount"
                step="0.01"
                min="0"
                placeholder="0.00"
                required
            >

            <label for="start_date">Start Date</label>
            <input
                type="date"
                id="start_date"
                required
            >

            <label for="end_date">End Date</label>
            <input
                type="date"
                id="end_date"
                required
            >

            <label for="description">Description</label>
            <input
                type="text"
                id="description"
                placeholder="Optional description"
            >

            <button type="submit">
                Add Budget
            </button>

        </form>
            
        <h2>Budgets</h2>

        <button
            type="button"
            hx-get="http://127.0.0.1:5004/budgets-html"
            hx-target="#htmxResult"
            hx-swap="innerHTML">
            Refresh Budgets with HTMX
        </button>

        <div id="htmxResult"></div>


        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="budgetTable">
            </tbody>

        </table>


        <div class="ai-section">

            <h2>AI Budget Insights</h2>

            <button
                type="button"
                id="aiButton">
                Get AI Budget Insights
            </button>

            <div id="aiResult"></div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
