name: Grace CI

on:
  push:
    branches: [grace-release1, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-savings:
    runs-on: ubuntu-latest
    env:
      AI_MODE_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      RUN_SAVINGS_CI_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install -r grace/backend/requirements.txt -r ai-services/requirements.txt pytest
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Run shared regression tests without local AI services
        run: |
          mkdir -p reports/release1
          python -m pytest ai-services/tests --junitxml=reports/release1/shared-tests.xml
      - name: Build savings microservices
        run: docker compose build grace-database grace-backend grace-frontend
      - name: Start savings microservices
        run: docker compose up -d grace-database grace-backend grace-frontend
      - name: Wait for readiness
        run: |
          python - <<'PY'
          import time
          import requests
          for url in ['http://127.0.0.1:3003', 'http://127.0.0.1:5003/health', 'http://127.0.0.1:6003/']:
              for attempt in range(30):
                  try:
                      if requests.get(url, timeout=2).status_code == 200:
                          break
                  except requests.RequestException:
                      pass
                  time.sleep(1)
              else:
                  raise SystemExit(f'Service did not become ready: {url}')
          PY
      - name: Validate savings and disabled AI modes
        run: python -m pytest grace/tests/test_release1_ci.py --junitxml=reports/release1/savings-ci-tests.xml
      - name: Capture execution evidence
        if: always()
        run: |
          mkdir -p reports/release1
          docker compose ps > reports/release1/containers.txt
          docker compose logs --no-color grace-database grace-backend grace-frontend > reports/release1/services.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'commit': os.environ['GITHUB_SHA'],
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'disabled_modes': {key: os.environ[key] for key in ['AI_MODE_ENABLED', 'MCP_ENABLED', 'RAG_ENABLED']},
          }
          Path('reports/release1/workflow.json').write_text(json.dumps(evidence, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: savings-release1-evidence
          path: reports/release1/
      - name: Stop disposable CI services
        if: always()
        run: docker compose down --volumes
