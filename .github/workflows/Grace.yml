name: Grace CI

on:
  push:
    branches:
      - grace
  pull_request:
    branches:
      - main

jobs:
  test-grace-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r grace/backend/requirements.txt

      - name: Install database dependencies
        run: |
          pip install -r grace/database/requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile grace/backend/app.py
          python -m py_compile grace/database/app.py
          python -m py_compile grace/database/init_db.py
          # python -m py_compile grace/agentic_loop.py
          # python -m py_compile grace/tests/test_backend.py

      - name: Build grace backend Docker image
        run: |
          docker build -t grace-backend ./grace/backend

      - name: Build grace database Docker image
        run: |
          docker build -t grace-database ./grace/database
