name: Bills-Working

on:
  push:
    branches: Luke

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
          docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)
    
    - name: check frontend 
      run: |
        docker-compose build \
        bills-frontend

    - name: check backend
      run: |
        docker-compose build \
        bills-backend

    - name: check database
      run: |
        docker-compose build \
        bills-database

  smoke-check:
      runs-on: ubuntu-latest
      needs: [build-images]

      steps:
        - uses: actions/checkout@v4

        - name: Verify docker-compose
          run: |
            docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)

        - name: Start the bill-management services
          run: docker-compose up -d bills-database bills-backend bills-frontend
        
        - name: Smoke Checks
          run: |
            check_url()