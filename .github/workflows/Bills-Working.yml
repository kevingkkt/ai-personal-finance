name: Bills-Working

on:
  push:
    branches: 
      - Luke

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Build the Docker image
      run: |
          docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)
    
    - name: check frontend 
      run: |
        docker-compose build \
        bills-frontend

    - name: check backend
      run: |
        docker-compose build \
        bills-backend

    - name: check database
      run: |
        docker-compose build \
        bills-database

  smoke-check:
      runs-on: ubuntu-latest
      needs: [build]

      steps:
        - uses: actions/checkout@v5

        - name: Verify docker-compose
          run: |
            docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)

        - name: Start the bill-management services
          run: docker-compose up -d bills-database bills-backend bills-frontend
        
        - name: Smoke checks
          run: |
            check_url() {
              local url="$1"
              local attempts=8
              local code=""

              for i in $(seq 1 "$attempts"); do
                code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 20 "$url" || true)
                if [ "$code" = "200" ]; then
                  echo "PASS $url -> $code"
                  return 0
                fi
                echo "Retry $i/$attempts for $url (got: ${code:-none})"
                sleep 2
              done

              echo "FAIL $url after $attempts attempts"
              return 1
            }

            check_url "http://localhost:8084/"
            check_url "http://localhost:5001/health"
            check_url "http://localhost:5002/health"

        - name: stop the bills docker
          if: always()
          run: docker-compose down
  evidence-pack:
    runs-on: ubuntu-latest
    needs: [smoke-check]

    steps:
      - uses: actions/checkout@v5

      - name: Create reports directory
        run: mkdir -p reports
        working-directory: ${{ github.workspace }}
      
      - name: get report.json
        run: |
          cat > reports/report.json <<EOL
          {
          "workflow_name": "Bills-Working",
          "run_id": "${{ github.run_id }}",
          "commit_sha": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "generated_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOL

      - name: Generate report.md
        run: |
          cat > reports/report.md << EOL
          ## Bills Workflow Report

          - Workflow: Bills section of the assessment
          - Run ID: ${{ github.run_id }}
          - Commit SHA: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          EOL
    
      - name: Generate run-view.md
        run: |
          cat > reports/run-view.md << EOF
          Run URL:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
        
      - uses: actions/upload-artifact@v4
        with:
          name: bills-report
          path: reports