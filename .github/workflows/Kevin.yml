name: Kevin CI

on:
  push:
    branches:
      - kevin
  pull_request:
    branches:
      - main

jobs:
  test-kevin-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r kevin/backend/requirements.txt

      - name: Install database dependencies
        run: |
          pip install -r kevin/database/requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile kevin/backend/app.py
          python -m py_compile kevin/database/app.py
          python -m py_compile kevin/database/init_db.py
          python -m py_compile kevin/agentic_loop.py
          python -m py_compile kevin/tests/test_backend.py

      - name: Build Kevin backend Docker image
        run: |
          docker build -t kevin-backend ./kevin/backend

      - name: Build Kevin database Docker image
        run: |
          docker build -t kevin-database ./kevin/database

      - name: Build Kevin frontend Docker image
        run: |
          docker build -t kevin-frontend ./kevin/frontend